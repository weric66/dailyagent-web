<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 每日早報 - 歷史日報</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
            --text-secondary: #666666;
            --text-muted: #888888;
            --accent: #1a73e8;
            --border: #eeeeee;
            --card-shadow: rgba(0, 0, 0, 0.06);
            --card-hover-shadow: rgba(0, 0, 0, 0.12);
            --header-hover: #f8f9fa;
            --stat-bg: #ffffff;
            --spinner-track: #dddddd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --card-bg: #16213e;
                --text: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-muted: #888888;
                --accent: #64b5f6;
                --border: #2a2a4a;
                --card-shadow: rgba(0, 0, 0, 0.3);
                --card-hover-shadow: rgba(0, 0, 0, 0.5);
                --header-hover: #1e2a4a;
                --stat-bg: #16213e;
                --spinner-track: #444444;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 1.8em;
            color: var(--accent);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--stat-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            color: var(--text-secondary);
            box-shadow: 0 1px 3px var(--card-shadow);
        }

        .report-list {
            margin-top: 20px;
        }

        .report-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px var(--card-shadow);
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .report-card:hover {
            box-shadow: 0 4px 12px var(--card-hover-shadow);
        }

        .report-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .report-header:hover {
            background: var(--header-hover);
        }

        .report-date {
            font-weight: 600;
            font-size: 1.05em;
            color: var(--accent);
        }

        .report-weekday {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .report-toggle {
            font-size: 1.2em;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .report-toggle.open {
            transform: rotate(180deg);
        }

        .report-content {
            display: none;
            padding: 0 20px 20px;
            white-space: pre-wrap;
            font-size: 0.9em;
            line-height: 1.8;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 0;
            padding-top: 16px;
        }

        .report-content.show {
            display: block;
        }

        .report-content a {
            color: var(--accent);
            text-decoration: none;
        }

        .report-content a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--spinner-track);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .error {
            text-align: center;
            padding: 60px 0;
            color: #e53935;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.8em;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 1.4em;
            }

            .report-header {
                padding: 12px 16px;
            }

            .report-content {
                padding: 0 16px 16px;
                font-size: 0.85em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>AI 每日早報</h1>
            <p>每日自動彙整台灣 AI 政策、資安、法規新聞</p>
            <div class="stats">
                <span class="stat-item" id="total-count">載入中...</span>
                <span class="stat-item" id="latest-date">-</span>
            </div>
        </header>

        <div class="report-list" id="report-list">
            <div class="loading" id="loading">正在載入歷史日報</div>
        </div>

        <footer>
            Powered by Google Gemini + GitHub Actions + GitHub Pages
        </footer>
    </div>

    <script>
        const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

        function getWeekday(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return '週' + WEEKDAYS[d.getDay()];
        }

        function linkify(text) {
            // 先處理 Markdown 格式 [text](url)
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            // 再處理剩餘的純 URL
            text = text.replace(/(^|[^"'])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
            return text;
        }

        async function loadReports() {
            const listEl = document.getElementById('report-list');
            const loadingEl = document.getElementById('loading');

            try {
                const indexRes = await fetch('data/index.json');
                if (!indexRes.ok) throw new Error('找不到 data/index.json');
                const dates = await indexRes.json();

                if (dates.length === 0) {
                    listEl.innerHTML = '<div class="empty">尚無歷史日報資料</div>';
                    return;
                }

                document.getElementById('total-count').textContent = `共 ${dates.length} 期`;
                document.getElementById('latest-date').textContent = `最新：${dates[0]}`;

                loadingEl.remove();
                for (const date of dates) {
                    const card = createCard(date);
                    listEl.appendChild(card);
                }

            } catch (err) {
                listEl.innerHTML = `<div class="error">載入失敗：${err.message}<br>請確認 GitHub Pages 已啟用並已有日報資料。</div>`;
            }
        }

        function createCard(date) {
            const card = document.createElement('div');
            card.className = 'report-card';

            const weekday = getWeekday(date);

            card.innerHTML = `
                <div class="report-header" onclick="toggleReport(this, '${date}')">
                    <div>
                        <span class="report-date">${date}</span>
                        <span class="report-weekday">${weekday}</span>
                    </div>
                    <span class="report-toggle">▼</span>
                </div>
                <div class="report-content" id="content-${date}"></div>
            `;

            return card;
        }

        async function toggleReport(headerEl, date) {
            const contentEl = document.getElementById(`content-${date}`);
            const toggleEl = headerEl.querySelector('.report-toggle');

            if (contentEl.classList.contains('show')) {
                contentEl.classList.remove('show');
                toggleEl.classList.remove('open');
                return;
            }

            if (!contentEl.dataset.loaded) {
                contentEl.textContent = '載入中...';
                contentEl.classList.add('show');
                toggleEl.classList.add('open');

                try {
                    const res = await fetch(`data/${date}.json`);
                    if (!res.ok) throw new Error('載入失敗');
                    const data = await res.json();
                    contentEl.innerHTML = linkify(data.summary || '（無內容）');
                    contentEl.dataset.loaded = 'true';
                } catch (err) {
                    contentEl.textContent = '載入失敗，請稍後重試';
                }
            } else {
                contentEl.classList.add('show');
                toggleEl.classList.add('open');
            }
        }

        loadReports();
    </script>
</body>

</html>
